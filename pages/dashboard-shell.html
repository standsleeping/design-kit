<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Dashboard shell · design-kit</title>
<link rel="stylesheet" href="tokens.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="components/app-shell.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="components/sidebar.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="components/nav-stack.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="components/topbar.css?{{CACHE_BUST}}">
<link rel="stylesheet" href="components/luminance-toggle.css?{{CACHE_BUST}}">
<style>
  /* ── Dashboard shell ────────────────────────────────────────────────────
     A three-column application shell built from `dk-app-shell` + the system
     sidebar (left) + the demo right panel. The middle column carries a
     `dk-topbar` chrome strip and a `dk-topbar dk-topbar-bottom` footer
     strip; the right panel is itself a Sidebar with header + footer slots
     that bind to `--layout-chrome-bar-h` (PEER_RAIL) with the main strips.
     AppShell's own header/footer slots are intentionally absent because
     the chrome lives per-column, not shell-wide.

     Compare the Sidebar `with-nav-stack` variant in storybook.html for the
     single-sidebar composition. */

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--typography-mono);
    --mono: 1;
    font-size: var(--font-size-xs);
  }

  /* Right panel surface tone, kept distinct from the system sidebar's
     default surface so the page reads as left chrome / center body / right
     inspector. The system sidebar inherits its own surface from sidebar.css. */
  #right { background: var(--color-bg); }

  /* Collapse / expand visibility for the controls in main-chrome. The
     system sidebar (aside.dk-app-shell-left) has no built-in chrome of its
     own, so both directions of the collapse toggle live here; the
     data-nav-collapsed / data-right-collapsed markers on the shell drive
     which direction is reachable at any time. */
  #nav-expand, #right-expand { display: none; }
  .dk-app-shell[data-nav-collapsed] #nav-expand { display: inline-flex; }
  .dk-app-shell[data-nav-collapsed] #nav-collapse { display: none; }
  .dk-app-shell[data-right-collapsed] #right-expand { display: inline-flex; }

  /* Collapse/expand buttons in chrome strips (the visual treatment of the
     buttons themselves; the strips are dk-topbar). */
  .chrome-btn {
    flex-shrink: 0;
    padding: var(--spacing-xs) var(--spacing-sm);
    border: none;
    background: transparent;
    cursor: pointer;
    color: var(--color-text-muted);
    font-family: inherit;
    font-size: var(--font-size-sm);
    line-height: var(--font-line-height-none);
    transition: color 0.15s ease;
  }
  .chrome-btn:hover { color: var(--color-text); }
  .chrome-btn:focus-visible {
    outline: var(--border-width-medium) solid var(--color-link);
    outline-offset: -2px;
  }

  /* ── Main column wrap: chrome strip (dk-topbar) + scroll body + footer
     strip (dk-topbar-bottom). dk-app-shell-main owns the column slot but
     we need a flex column inside it so the body region scrolls between
     the two chrome strips. The shell's default overflow: auto on main is
     overridden here because main contains its own scroll body. ── */
  .dk-app-shell-main {
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .main-body {
    flex: 1;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .main-body::-webkit-scrollbar { display: none; }
  .main-placeholder,
  .right-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    padding: var(--spacing-2xl);
    color: var(--color-text-muted);
    font-style: italic;
  }
</style>
</head>
<body>
<div class="dk-app-shell" id="shell">


  <header class="dk-app-shell-header dk-topbar">
    <span class="dk-topbar-title dk-topbar-title-eyebrow">Design Kit</span>
  </header>
  <div class="dk-app-shell-body">

    <!-- System sidebar (left): standard contract slot. -->
    <aside class="dk-app-shell-left dk-sidebar dk-sidebar-left dk-sidebar-mode-inline"
           id="nav"
           data-state="expanded"
           style="--dk-sidebar-width: var(--dk-rail-nav-w, 220px);"
           aria-label="Design Kit navigation">
      <div class="dk-sidebar-main" data-slot="main" data-system-nav data-current="dashboard-shell"></div>
    </aside>

    <!-- Center column: chrome strip + body + footer strip. -->
    <main class="dk-app-shell-main">
      <header class="dk-topbar">
        <button class="chrome-btn" id="nav-collapse" aria-label="Collapse navigation">«</button>
        <button class="chrome-btn" id="nav-expand" aria-label="Expand navigation">»</button>
        <span class="dk-topbar-title dk-topbar-title-eyebrow">Lorem ipsum</span>
        <span data-luminance aria-label="Luminance mode"></span>
        <button class="chrome-btn" id="right-expand" aria-label="Expand panel">«</button>
      </header>
      <div class="main-body">
        <div class="main-placeholder">Lorem ipsum dolor sit amet</div>
      </div>
      <footer class="dk-topbar dk-topbar-bottom"></footer>
    </main>

    <!-- Right panel: DK Sidebar (right, inline, expanded, 260px). -->
    <div class="dk-app-shell-right">
      <div class="dk-sidebar dk-sidebar-right dk-sidebar-mode-inline"
           data-state="expanded"
           style="--dk-sidebar-width: 260px;"
           id="right"
           aria-label="Lorem">
        <div class="dk-sidebar-header dk-topbar" data-slot="header">
          <button class="chrome-btn" id="right-collapse" aria-label="Collapse panel">»</button>
          <span class="dk-topbar-title">Lorem</span>
        </div>
        <div class="dk-sidebar-main" data-slot="main">
          <div class="right-placeholder">Lorem ipsum</div>
        </div>
        <div class="dk-sidebar-footer dk-topbar dk-topbar-bottom" data-slot="footer"></div>
      </div>
    </div>

  </div>

</div>

<script type="module" src="components/system/system-sidebar.js?{{CACHE_BUST}}"></script>

<script type="module">
const cb = '{{CACHE_BUST}}';
const luminanceMod = await import(`./components/luminance-toggle.js?v=${cb}`);

// Column collapse: flip the sidebar's data-state and a marker on the shell.
// The marker drives re-expand button visibility in main-chrome. The system
// sidebar (left) is collapsed through the chrome-strip » button next to its
// title; expansion happens via the « button that appears once collapsed.
const shell = document.getElementById('shell');
const navSb = document.getElementById('nav');
const rightSb = document.getElementById('right');
document.getElementById('nav-collapse').addEventListener('click', () => {
  navSb.dataset.state = 'hidden';
  shell.dataset.navCollapsed = 'true';
});
document.getElementById('nav-expand').addEventListener('click', () => {
  navSb.dataset.state = 'expanded';
  delete shell.dataset.navCollapsed;
});
document.getElementById('right-collapse').addEventListener('click', () => {
  rightSb.dataset.state = 'hidden';
  shell.dataset.rightCollapsed = 'true';
});
document.getElementById('right-expand').addEventListener('click', () => {
  rightSb.dataset.state = 'expanded';
  delete shell.dataset.rightCollapsed;
});

// Luminance toggle.
const luminanceMount = document.querySelector('[data-luminance]');
let stored = null;
try { stored = localStorage.getItem('dk-luminance'); } catch {}
const initial = stored === 'light' || stored === 'dark' ? stored : 'auto';
if (initial === 'auto') {
  document.documentElement.removeAttribute('data-luminance');
} else {
  document.documentElement.setAttribute('data-luminance', initial);
}
luminanceMount.append(luminanceMod.render({ value: initial }));
</script>
</body>
</html>
