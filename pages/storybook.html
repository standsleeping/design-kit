<title>Storybook · design-kit</title>
<script>/* dk-first-paint geometry — reserve the inspector rail width before paint so
   storybook.js mounts the right Sidebar into a box that is already the right
   size (HYDRATION_RESERVES_GEOMETRY). The left nav width is universal (every
   page hosts the same system sidebar) and is established by the head bootstrap
   from the shared `dk-sidebar-nav-width` key, so this script only handles the
   page-specific inspector. */
(function(){try{var d=document.documentElement,p=JSON.parse(localStorage.getItem('dk-storybook-layout')||'{}');
if(p.inspector)d.style.setProperty('--dk-rail-inspector-w',Number(p.inspector)+'px');
}catch(e){}})();</script>

<style>
  /* Storybook is a dog-food rebuild of the design-kit framework on itself:
     dk-app-shell + two Sidebars + dk-topbar strips. Page-local CSS scope is
     storybook-specific content (component nav links, pool tabs, variant cards,
     axes inputs, event log, props form). Never layout chrome. */

  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--typography-body);
  }

  /* First-paint geometry reservation (HYDRATION_RESERVES_GEOMETRY). Before
     storybook.js mounts the two Sidebars, the rails already carry their final
     width from the persisted-layout custom props set by the head geometry
     bootstrap (falling back to the layout defaults). Without this the empty left
     rail is display:none (0 width) and the right rail sizes to its intrinsic
     content; mounting a Sidebar then widens both and reflows the center column.
     The left rail is empty until mount, so this also overrides app-shell's
     `:empty { display:none }` collapse for the reserving state — equal specificity,
     later source, so it wins. The `storybook-rail-reserving` class is removed on
     mount; the Sidebar then drives the width and the resizer works normally. */
  .dk-app-shell-left.storybook-rail-reserving {
    display: block;
    width: var(--dk-rail-nav-w, 220px); /* dimension-lint: ok, default mirrors LAYOUT_DEFAULTS.nav in storybook.js */
  }
  .dk-app-shell-right.storybook-rail-reserving {
    width: var(--dk-rail-inspector-w, 320px); /* dimension-lint: ok, default mirrors LAYOUT_DEFAULTS.inspector in storybook.js */
  }

  .storybook-mobile-notice {
    display: none;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-2xl);
    font-family: var(--typography-mono);
    font-size: var(--font-size-sm);
    color: var(--color-text);
    --mono: 1;
  }

  .storybook-mobile-notice-title {
    font-weight: var(--font-weight-semibold);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
  }

  .storybook-mobile-notice-body {
    color: var(--color-text-muted);
    line-height: var(--font-line-height-relaxed);
  }

  /* The shell auto-collapses its rails down to tablet (see installResponsiveRails
     in storybook.js); below that there isn't room even rail-collapsed, so fall
     back to the notice. `body >` raises specificity above the plain
     `.dk-app-shell { display: flex }` that the storybook injects when it renders
     the AppShell component card — that injected sheet loads after this <style>,
     so an equal-specificity rule here would lose the cascade. */
  @media (width <= $bp-tablet) {
    body > .dk-app-shell { display: none; }
    .storybook-mobile-notice { display: flex; }
  }

  /* AppShell-header content: count + theme/luminance controls, all monospace
     to match the rail. The dk-topbar provides height, padding, border.

     The count is a bare-text peer of the toggle buttons. <span> inherits
     line-height from the cascade (relaxed = 1.6); <button> uses UA
     line-height: normal (~1.2 for the monospace face). Same font-size, same
     padding, same border — but different inline-box heights, so the visible
     glyphs land at different y positions even after `align-items: center`
     centers the outer boxes. text-box: trim-both cap alphabetic anchors the
     visible glyph rectangle to font metrics (cap-height on top, alphabetic
     baseline on bottom) instead of line-height, so the count and the
     toggle-button peers end up the same height regardless of the
     line-height drift. The xs block-axis padding + thin transparent border
     give the count the same outer envelope as the buttons' padding+border
     so the trimmed glyph boxes line up. */
  .storybook-header-count {
    padding: var(--spacing-xs) 0; /* padding-lint: ok */
    border-block: var(--border-width-thin) solid transparent;
    color: var(--color-text-muted);
    text-box: trim-both cap alphabetic;
  }

  /* Below tablet-max the header rail gets tight; drop the lowest-priority
     item (the registered count) so the theme/luminance toggles keep room
     rather than overflowing the fixed-height rail. */
  @media (width <= $bp-tablet-max) {
    .storybook-header-count { display: none; }
  }
  .storybook-header-count,
  .storybook-header-title {
    font-family: var(--typography-mono);
    font-size: var(--font-size-xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    --mono: 1;
  }

  /* Main column wrap: two chrome strips (width controls + axes) + scrolling
     variants body. The strips stack inside .dk-app-shell-main; the body
     consumes remaining vertical space. */
  .storybook-main-wrap {
    display: flex;
    flex-direction: column;
    height: 100%;
    min-height: 0;
  }

  .storybook-main-body {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scrollbar-width: none;
  }
  .storybook-main-body::-webkit-scrollbar { display: none; }

  /* Width / height controls strip. Sits on a dk-topbar; inputs and labels are
     children. The labels need a row layout (label text + range slider).
     Like the axes strip below, it wraps (auto height, keeping the rail height as
     a floor) so a narrow main column never forces the center container to scroll
     horizontally. The controls flow onto extra rows instead. */
  .storybook-controls-row {
    flex-wrap: wrap;
    height: auto;
    min-height: calc(var(--layout-chrome-bar-h) * var(--chrome-bar-rows, 1));
    row-gap: var(--spacing-sm);
  }

  .storybook-controls-row label {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-sm);
    font-family: var(--typography-mono);
    font-size: var(--font-size-xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    color: var(--color-text-muted);
    --mono: 1;
  }

  /* Width/height numeric inputs use .dk-number-input.dk-number-input-sm; this
     only carries the character-relative width override that the kit's default
     width token (--control-input-width-xs, 4.5rem) wouldn't provide. */
  .storybook-controls-row .dk-number-input {
    width: 5ch; /* dimension-lint: ok, character-relative width for compact numeric input */
  }

  /* The selected component name reads as a breadcrumb after "Storybook" in the
     header title. It lives inside .dk-topbar-title, so it inherits the title's
     uppercase, letter-spacing, and ellipsis. A long name truncates with the
     title rather than crowding the WIDTH/HEIGHT controls it used to share a
     strip with. The separator shows only when a component is selected. */
  .storybook-breadcrumb {
    font-weight: var(--font-weight-semibold);
    color: var(--color-text);
  }
  .storybook-breadcrumb:not(:empty)::before {
    content: " · ";
    color: var(--color-text-muted);
  }

  .storybook-component-example {
    font-family: var(--typography-mono);
    font-size: var(--font-size-xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    color: var(--color-link);
    text-decoration: none;
    border-bottom: var(--border-width-thin) solid transparent;
    --mono: 1;
  }
  .storybook-component-example:hover { border-bottom-color: var(--color-link); }
  .storybook-component-example:focus-visible {
    outline: var(--border-width-medium) solid var(--color-focus-ring);
    outline-offset: 2px;
  }
  .storybook-component-example[hidden] { display: none; }

  /* Font-axes strip: more items than the width/height row, so it doesn't bind
     to --layout-chrome-bar-h. It carries the same visual treatment (border,
     square padding) but has flex-wrap and auto height because at narrow
     widths the four axis sliders would overflow. */
  .storybook-axes-control {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    flex-wrap: wrap;
    gap: var(--spacing-md);
    padding: var(--spacing-md);
    border-bottom: var(--border-width-thin) solid var(--color-border);
    font-family: var(--typography-mono);
    font-size: var(--font-size-xs);
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    --mono: 1;
    box-sizing: border-box;
  }

  .storybook-axes-control label {
    display: inline-flex;
    align-items: center;
    gap: var(--spacing-xs);
  }

  /* Axes range inputs use .dk-range-input inside a .dk-range.dk-range-sm
     container; this overrides the kit's flex:1 to a fixed 80px so the four
     axes share rail width predictably. */
  .storybook-axes-control .dk-range-input { flex: 0 0 auto; width: 80px; } /* dimension-lint: ok, compact range input for axes panel chrome */

  .storybook-axes-control .dk-range-value {
    color: var(--color-text);
  }

  /* Both reset buttons (axes strip, props inspector) use .dk-button-sm; the
     overrides here are chrome-flavor refinements (2xs uppercase, persistent
     border, muted-on-default) layered onto the kit's compact-tier button. */
  .dk-button.dk-button-sm.storybook-reset {
    font-size: var(--font-size-2xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    color: var(--color-text-muted);
    border-color: var(--color-border);
  }
  .dk-button.dk-button-sm.storybook-reset:hover {
    color: var(--color-text);
    border-color: var(--color-text-muted);
  }
  .storybook-axes-control .storybook-reset {
    margin-left: auto;
  }

  /* Variants area: cards with per-card resize handles */
  .storybook-variants {
    display: flex;
    flex-wrap: wrap;
    gap: var(--spacing-xl);
    padding: var(--spacing-xl);
  }

  .storybook-variant-card {
    display: flex;
    flex-direction: column;
    border: var(--border-width-thin) solid var(--color-border);
    background: var(--color-bg);
    position: relative;
    --storybook-resize-grip: 6px;
    --storybook-resize-corner: 14px;
    --storybook-resize-offset: -3px;
  }

  .storybook-variant-card-overridden {
    outline: var(--border-width-thin) dashed var(--color-focus-ring);
    outline-offset: -1px;
  }

  .storybook-variant-resize {
    position: absolute;
    background: transparent;
    z-index: 1;
    touch-action: none;
  }

  .storybook-variant-resize-x {
    top: 0;
    right: var(--storybook-resize-offset);
    bottom: 0;
    width: var(--storybook-resize-grip);
    cursor: col-resize;
  }

  .storybook-variant-resize-y {
    left: 0;
    right: 0;
    bottom: var(--storybook-resize-offset);
    height: var(--storybook-resize-grip);
    cursor: row-resize;
  }

  .storybook-variant-resize-xy {
    right: var(--storybook-resize-offset);
    bottom: var(--storybook-resize-offset);
    width: var(--storybook-resize-corner);
    height: var(--storybook-resize-corner);
    cursor: nwse-resize;
    z-index: 2;
  }

  .storybook-variant-resize:hover,
  .storybook-variant-resize:active {
    background: var(--color-focus-ring);
  }
  .storybook-variant-resize:focus-visible {
    background: var(--color-focus-ring);
    outline: var(--border-width-thin) solid var(--color-focus-ring);
    outline-offset: 1px;
  }

  .storybook-variant-footer {
    border-top: var(--border-width-thin) solid var(--color-border);
    padding: var(--spacing-xs) var(--spacing-md);
    font-family: var(--typography-mono);
    --mono: 1;
    font-size: var(--font-size-2xs);
    color: var(--color-text-muted);
    text-align: right;
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
  }

  .storybook-variant-header {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: var(--border-width-thin) solid var(--color-border);
    font-family: var(--typography-mono);
    --mono: 1;
  }

  .storybook-variant-name {
    font-size: var(--font-size-2xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    color: var(--color-text);
    font-weight: var(--font-weight-semibold);
  }

  .storybook-variant-description {
    font-size: var(--font-size-2xs);
    color: var(--color-text-muted);
  }

  .storybook-variant-body {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: var(--spacing-xl);
    position: relative;
    min-height: 200px; /* dimension-lint: ok, storybook variant cell floor */
  }

  /* Inspector content (lives in right Sidebar's main slot) */
  .storybook-inspector-host {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
    padding: var(--spacing-lg);
    font-family: var(--typography-mono);
    font-size: var(--font-size-xs);
    --mono: 1;
  }

  .storybook-event-log {
    display: flex;
    flex-direction: column;
  }

  .storybook-event-row {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
    padding: var(--spacing-sm) var(--spacing-md);
    border-bottom: var(--border-width-thin) solid var(--color-border);
  }

  .storybook-event-meta {
    font-size: var(--font-size-2xs);
    color: var(--color-text);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
  }

  .storybook-event-detail {
    font-size: var(--font-size-2xs);
    color: var(--color-text-muted);
    overflow-wrap: anywhere;
  }

  .storybook-event-empty {
    padding: var(--spacing-sm) var(--spacing-md);
    font-size: var(--font-size-2xs);
    color: var(--color-text-muted);
    font-style: italic;
  }


  .storybook-inspector-panel[hidden] { display: none; }

  /* Props panel: header + form stacked with sm gap. */
  .storybook-inspector-panel[data-storybook-inspector-panel="props"] {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-sm);
  }

  .storybook-props-header {
    display: flex;
    align-items: center;
    justify-content: flex-end;
  }

  .storybook-props-form {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-md);
  }

  .storybook-prop-row {
    display: flex;
    flex-direction: column;
    gap: var(--spacing-xs);
  }

  .storybook-prop-label {
    font-family: var(--typography-mono);
    font-size: var(--font-size-2xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    color: var(--color-text-muted);
  }

  .storybook-prop-type {
    font-weight: var(--font-weight-regular);
    color: var(--color-text-muted);
  }

  .storybook-props-empty {
    font-size: var(--font-size-2xs);
    color: var(--color-text-muted);
    font-style: italic;
  }

  /* AppShell footer content */
  .storybook-footer-hash {
    color: var(--color-text);
    font-weight: var(--font-weight-medium);
    font-family: var(--typography-mono);
    font-size: var(--font-size-2xs);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    --mono: 1;
  }
  .storybook-footer-size {
    white-space: nowrap;
    font-family: var(--typography-mono);
    font-size: var(--font-size-2xs);
    color: var(--color-text-muted);
    text-transform: uppercase;
    letter-spacing: var(--font-letter-spacing-wide);
    --mono: 1;
  }
</style>
</head>
<body>
<div class="dk-app-shell">

  <header class="dk-app-shell-header dk-topbar">
    <span class="storybook-header-title dk-topbar-title">Storybook<span class="storybook-breadcrumb" data-storybook-component-name></span></span>
    <a class="storybook-component-example" data-storybook-component-example target="_blank" rel="noopener noreferrer" hidden></a>
    <span class="storybook-header-count" data-storybook-count></span>
    <span data-storybook-color-theme></span>
    <span data-storybook-luminance></span>
  </header>

  <div class="dk-app-shell-body">

    <!-- System nav slot. storybook.js mounts a Sidebar here and delegates
         to mountSystemSidebar with augmented levels (system root + a
         storybook sub-level holding the component list). The slot opts
         out of auto-mount via [data-system-nav-manual] because the page
         needs the augmented level structure; see components/storybook.js. -->
    <div class="dk-app-shell-left storybook-rail-reserving"
         data-system-nav
         data-system-nav-manual
         data-current="storybook"></div>

    <main class="dk-app-shell-main">
      <div class="storybook-main-wrap">

        <header class="dk-topbar storybook-controls-row" data-wrap-ok>
          <label>Width
            <input type="range" min="120" max="800" value="280" data-storybook-width-slider>
          </label>
          <input class="dk-number-input dk-number-input-sm" type="number" min="120" max="800" value="280" data-storybook-width-number>
          <label>Height
            <input type="range" min="0" max="800" value="0" data-storybook-height-slider>
          </label>
          <input class="dk-number-input dk-number-input-sm" type="number" min="0" max="800" value="0" data-storybook-height-number placeholder="auto">
        </header>

        <div class="storybook-axes-control" aria-label="Font axes">
          <label class="dk-range dk-range-sm">MONO
            <input class="dk-range-input" type="range" min="0" max="1" step="0.1" value="1" data-storybook-axis="mono">
            <span class="dk-range-value" data-storybook-axis-readout="mono">1.0</span>
          </label>
          <label class="dk-range dk-range-sm">CASL
            <input class="dk-range-input" type="range" min="0" max="1" step="0.1" value="0" data-storybook-axis="casl">
            <span class="dk-range-value" data-storybook-axis-readout="casl">0.0</span>
          </label>
          <label class="dk-range dk-range-sm">slnt
            <input class="dk-range-input" type="range" min="-15" max="0" step="1" value="0" data-storybook-axis="slnt">
            <span class="dk-range-value" data-storybook-axis-readout="slnt">0</span>
          </label>
          <label class="dk-range dk-range-sm">CRSV
            <input class="dk-range-input" type="range" min="0" max="1" step="0.1" value="0.5" data-storybook-axis="crsv">
            <span class="dk-range-value" data-storybook-axis-readout="crsv">0.5</span>
          </label>
          <button type="button" class="dk-button dk-button-sm storybook-reset" data-storybook-axes-reset>Reset</button>
        </div>

        <div class="storybook-main-body">
          <div class="storybook-variants" data-storybook-variants></div>
        </div>

      </div>
    </main>

    <!-- Inspector content host. storybook.js wraps this in a right Sidebar at
         startup and moves the host's children into the Sidebar's main slot. -->
    <div class="dk-app-shell-right storybook-rail-reserving">
      <div class="storybook-inspector-host" data-storybook-inspector-host data-allow-x-scroll>
        <div class="dk-tab-bar" role="tablist">
          <button type="button" class="dk-tab-bar-tab dk-tab-bar-tab-sm dk-tab-bar-tab-active" data-storybook-inspector-tab="events" role="tab" aria-selected="true">Events</button>
          <span class="dk-tab-bar-separator" aria-hidden="true">·</span>
          <button type="button" class="dk-tab-bar-tab dk-tab-bar-tab-sm" data-storybook-inspector-tab="props" role="tab" aria-selected="false">Props</button>
        </div>
        <div class="storybook-inspector-panel" data-storybook-inspector-panel="events">
          <div class="storybook-event-log" data-storybook-events></div>
        </div>
        <div class="storybook-inspector-panel" data-storybook-inspector-panel="props" hidden>
          <div class="storybook-props-header">
            <button type="button" class="dk-button dk-button-sm storybook-reset" data-storybook-props-reset>Reset</button>
          </div>
          <div class="storybook-props-form" data-storybook-props-form></div>
        </div>
      </div>
    </div>

  </div>

  <footer class="dk-app-shell-footer dk-topbar dk-topbar-bottom" aria-live="polite">
    <span class="storybook-footer-hash" data-storybook-footer-hash>#design-kit/</span>
    <span class="dk-topbar-spacer"></span>
    <span class="storybook-footer-size" data-storybook-footer-size>Width 280px · Height auto</span>
  </footer>

</div>

<div class="storybook-mobile-notice">
  <div class="storybook-mobile-notice-title">Desktop only</div>
  <div class="storybook-mobile-notice-body">
    The component storybook is designed for viewports wider than 600px.
    Please revisit on a larger screen to browse variants, tune width and height,
    and inspect component events.
  </div>
</div>

<script type="module" src="components/system/system-sidebar.js?{{CACHE_BUST}}"></script>
<script type="module" src="components/storybook.js?v={{CACHE_BUST}}"></script>
<script>
  // Setup hook for peer-rail-audit.html: drill the system nav into the
  // storybook sub-level so the audit measures the back-button branch of
  // .dk-nav-stack-header (the variant that historically drifted from the
  // chrome-bar height). Pages that don't define this hook are audited in
  // their default render state.
  window.__dkPeerRailSetup = async function () {
    const findStorybookEntry = () => {
      const items = document.querySelectorAll(
        '[data-system-nav] .dk-nav-stack-item'
      );
      return Array.from(items).find(
        (el) => /storybook/i.test(el.textContent || '')
      );
    };
    // Poll briefly while the nav mounts; bail if it never appears.
    for (let i = 0; i < 20; i++) {
      const entry = findStorybookEntry();
      if (entry) { entry.click(); return; }
      await new Promise((r) => setTimeout(r, 50));
    }
  };
</script>
